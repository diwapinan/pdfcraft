# Builds the "diw edit" Windows x64 installer: PdfCraft 0.15.0 plus the added-text background,
# packaged by the project's own packaging/windows/package.ps1. Unsigned (no signing secrets here).
name: diw edit Windows build

on:
  workflow_dispatch:
  push:
    branches: [diw-edit]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PDFCRAFT_BUILD_LABEL: diw edit
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      DIST: ${{ github.workspace }}\dist\release
    steps:
      - uses: actions/checkout@v4

      - name: Fetch craft-fonts (the release's pinned revision)
        shell: pwsh
        run: |
          git clone https://github.com/storytold/craft-fonts craft-fonts
          git -C craft-fonts checkout b076417b5880bd4154bd22f00695b1d28c6bea83

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - name: WiX v5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-0.15.0-diw-edit-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error
