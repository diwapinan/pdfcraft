# Reproduces "the app quits on Print" on Windows with synthetic documents: a scanned-like A3 page
# turned 270 degrees, plus Latin or Thai added text (bold, white background), printed through
# doc_print (the app's own print path) normally and as image. Outcomes are annotations.
name: print repro (Windows)

on:
  workflow_dispatch:
  push:
    branches: [print-repro]

permissions:
  contents: read

jobs:
  print:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PDFCRAFT_BUILD_LABEL: diw edit
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch craft-fonts (the release's pinned revision)
        shell: pwsh
        run: |
          git clone https://github.com/storytold/craft-fonts craft-fonts
          git -C craft-fonts checkout b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build pdfcraft-cli (release, static CRT as the installer)
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p pdfcraft-cli --target x86_64-pc-windows-msvc
      - name: Printer whose port is a file
        shell: pwsh
        run: |
          Set-Service Spooler -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service Spooler -ErrorAction SilentlyContinue
          $drivers = (Get-PrinterDriver).Name
          Write-Output "::notice title=printer drivers::$($drivers -join ', ')"
          $driver = @('Microsoft Print To PDF', 'Microsoft XPS Document Writer v4', 'Generic / Text Only') | Where-Object { $drivers -contains $_ } | Select-Object -First 1
          if (-not $driver) { throw "no usable printer driver: $($drivers -join ', ')" }
          $port = "$env:RUNNER_TEMP\print-out.pdf"
          Add-PrinterPort -Name $port
          Add-Printer -Name 'PdfCraftTest' -DriverName $driver -PortName $port
          Write-Output "::notice title=test printer::PdfCraftTest uses $driver"
      - name: Synthetic scanned page
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          New-Item -ItemType Directory -Force cases | Out-Null
          python .github/print-repro/make_base.py cases/base.pdf
      - name: Print one-change variants of the Thai case
        shell: pwsh
        run: ./.github/print-repro/run2.ps1 -Cli "$PWD\target\x86_64-pc-windows-msvc\release\pdfcraft-cli.exe" -Dir "$PWD\cases" -Printer 'PdfCraftTest'
